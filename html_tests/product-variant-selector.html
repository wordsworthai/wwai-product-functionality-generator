<!DOCTYPE html>
<html>
  <head>

  <body>
       <label style="display: block; margin-bottom: 1rem;">

  <div style="max-width: 600px; margin: 40px auto;">

    >
        <!-- Price Display -->

      <label>

      <label>

      <div data-wwai-price-after-wrapper>

      </div>
      <div data-wwai-discount-percentage-wrapper>

  </product-subscription-frequency-selector>
    </product-variant-custom-labeled-text>
    </product-custom-price-selector>
  </div>
  
  <div style="max-width: 600px; margin: 40px auto;">
    <product-custom-submit-interceptor
    section_id="shopify-section-123"
    product_group="example-product-group"
    style="display: contents;"
  
    >
  <product-custom-add-to-cart-button-selector
  section_id="shopify-section-123"
  product_group="example-product-group"
  style="display: contents;"
>

    <!-- Required hidden inputs -->
    <input type="hidden" name="id" value="1234567890" />
    <input type="hidden" name="selling_plan" value="987654321" />
    <input type="hidden" name="quantity" value="1" />

    <!-- Submit button -->
    <button type="submit" class="add-to-cart-btn">
      <span data-wwai-add-to-cart-text>Add to Cart</span>
      <span data-wwai-sold-out-text style="display: none;">Sold Out</span>
    </button>
  </form>
</product-custom-add-to-cart-button-selector>
</product-custom-submit-interceptor>
<div>

  <div style="max-width: 600px; margin: 40px auto;">
  <product-variant-custom-labeled-text-selector
  section_id="shopify-section-abc123"
  product_group="dose-product-group"
  style="display: contents"
>
  <div
    data-wwai-variant-custom-label-text
    data-wwai-variant-custom-label-value="subscription"
  >

</product-variant-custom-labeled-text-selector>


<product-custom-carousel-media-selector

  <carousel-slider>

      <main-slider-slide class="main-media-item" id="media-1">

      </main-slider-slide>

    <thumb-slider>
      <thumb-slider-slide class="thumb-media-item">
        <img src="https://example.com/image1-thumb.jpg" alt="Thumbnail 1" width="100" height="100" />
      </thumb-slider-slide>
    </thumb-slider>
  </carousel-slider>
</product-custom-carousel-media-selector>
</div>

    </div>

    <script>
      getWWAIConfig().JS_PRODUCT_MAPPING_OBJECT
 = {
        "12345-main-product": {
          "16oz": "handle-1",
          "2oz": "handle-1"
        }
      };
    </script>

       <script>
       const VARIANT_CONFIG_UPDATE = {
  "shopify-section-12345": {
    "variantDispatchConfig": {
      "12345-main-product": {
        "defaultProduct": "16oz",
        "defaultVariantOption1": "3 Pack",
        "defaultVariantOption2": "Subscribe & Save",
        "defaultVariantOption3": null,
        "allProducts": "16oz | 2oz",
        "allOptions": {
          "option1": "3 Pack | 6 Pack",
          "option2": "One-Time Purchase | Subscribe & Save",
          "option3": ""
        }
      }
    }
  },
  "shopify-section-09876": {
    "variantDispatchConfig": {
      "12345-main-product-1": {
        "defaultProduct": "18oz",
        "defaultVariantOption1": null,
        "defaultVariantOption2": null,
        "defaultVariantOption3": null,
        "allProducts": "18oz",
        "allOptions": {
          "option1": "",
          "option2": "",
          "option3": ""
        }
      }
    }
  }
};
       function mergeVariantConfig(configUpdate) {
         window.__WWAI__SECTION_PRODUCT_DATA__ = window.__WWAI__SECTION_PRODUCT_DATA__ || {};
       
         Object.entries(configUpdate).forEach(([sectionId, sectionData]) => {
           const existingSection = window.__WWAI__SECTION_PRODUCT_DATA__[sectionId] || { variantDispatchConfig: {} };
       
           const newDispatchConfig = sectionData.variantDispatchConfig || {};
           const mergedDispatchConfig = {
             ...existingSection.variantDispatchConfig,
             ...newDispatchConfig
           };
       
           window.__WWAI__SECTION_PRODUCT_DATA__[sectionId] = {
             ...existingSection,
             variantDispatchConfig: mergedDispatchConfig
           };
         });
       }
       
       // 👉 Apply the update
       mergeVariantConfig(VARIANT_CONFIG_UPDATE);
      </script>

    <script src="../../dist/bundle.js"></script>
  </body>
</html>
